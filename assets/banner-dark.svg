<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
  <title id="t">Guido Fabian Cabrera, Desarrollador Full Stack</title>
  <desc id="d">Banner con el nombre, el rol y el stack: Vue, React, Next.js, Node.js y PostgreSQL.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0d10"/><stop offset="1" stop-color="#161c2b"/></linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.1" r="0.6"><stop offset="0" stop-color="#3b5bdb" stop-opacity="0.35"/><stop offset="1" stop-color="#3b5bdb" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#glow)"/>
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="64" y="86" font-size="20" fill="#9aa3b2">Corrientes, Argentina</text>
    <text x="64" y="158" font-size="68" font-weight="700" fill="#e7e9ee" letter-spacing="-1.5">Guido Fabian Cabrera</text>
    <text x="64" y="210" font-size="32" font-weight="600" fill="#8ab0ff">Desarrollador Full Stack</text>
    <text x="64" y="252" font-size="20" fill="#9aa3b2">Vue · React · Next.js · Node.js · PostgreSQL</text>
  </g>
  <g transform="translate(790 52)">
    <rect width="350" height="196" rx="14" fill="#12151a" stroke="#232a33"/>
    <circle cx="24" cy="24" r="6" fill="#ff5f56"/><circle cx="46" cy="24" r="6" fill="#ffbd2e"/><circle cx="68" cy="24" r="6" fill="#27c93f"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#e7e9ee">
      <text x="24" y="70"><tspan fill="#c792ea">const</tspan> guido = {</text>
      <text x="48" y="98">rol: <tspan fill="#a5e075">"full stack"</tspan>,</text>
      <text x="48" y="126">front: [<tspan fill="#a5e075">"Vue"</tspan>, <tspan fill="#a5e075">"React"</tspan>],</text>
      <text x="48" y="154">back: [<tspan fill="#a5e075">"Node.js"</tspan>],</text>
      <text x="24" y="182">};</text>
    </g>
  </g>
</svg>
